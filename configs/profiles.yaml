# Shared handwriting identity presets.
# All pages in one job must use a single profile.

neat_student:
  display_name: Neat student handwriting
  base_stroke_width: 1.6
  ink_color: [28, 36, 56]
  ink_opacity: 0.92
  slant_degrees: 2.0
  char_spacing: 1.02
  word_spacing: 1.15
  relative_size: 1.0
  curvature: 0.15
  baseline_drift: 0.4
  line_drift: 0.8
  variation: 0.04
  synthesis_level: C

everyday:
  display_name: Natural everyday handwriting
  base_stroke_width: 1.8
  ink_color: [20, 28, 48]
  ink_opacity: 0.9
